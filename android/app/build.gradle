//android\app\build.gradle
plugins {
  id "com.android.application"
  id "com.facebook.react"            // <-- use the DSL, not 'apply plugin'
  id 'kotlin-android'
  id "com.google.gms.google-services"
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
  namespace "com.akcruapp"
  compileSdkVersion 35

  defaultConfig {
    applicationId "com.akcruapp"
    minSdkVersion 23
    targetSdkVersion 35
    versionCode 1024
    versionName "1.0.24"
    multiDexEnabled true
    manifestPlaceholders = [ appAuthRedirectScheme: "akcruapp" ]
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
kotlinOptions {
    jvmTarget = "17"
  }

  buildFeatures { buildConfig true }

  def releaseKeystoreFile = project.hasProperty('MYAPP_UPLOAD_STORE_FILE') ? file(MYAPP_UPLOAD_STORE_FILE) : null
  def releaseSigningEnabled = releaseKeystoreFile != null && releaseKeystoreFile.exists()

  signingConfigs {
    release {
      if (releaseSigningEnabled) {
        storeFile releaseKeystoreFile
        storePassword MYAPP_UPLOAD_STORE_PASSWORD
        keyAlias MYAPP_UPLOAD_KEY_ALIAS
        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
      }
    }
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug  { signingConfig signingConfigs.debug }
    release {
      signingConfig releaseSigningEnabled ? signingConfigs.release : signingConfigs.debug
      minifyEnabled false
      shrinkResources false
        proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
    }
  }
}

dependencies {
  implementation("com.facebook.react:react-android")

  // Optional: to minimize variables while debugging the plugin conflict, comment this out now.
  // implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.24"))
  // Fresco core + GIF support (pin versions explicitly)
  implementation("com.facebook.fresco:fresco:3.6.0")
  implementation("com.facebook.fresco:animated-gif:3.6.0")

  // Optional: WebP support
  implementation("com.facebook.fresco:animated-webp:3.6.0")
  implementation("com.facebook.fresco:webpsupport:3.6.0")

  // implementation 'com.facebook.fresco:animated-base-support:1.3.0'
  // implementation 'com.facebook.fresco:animated-gif:2.5.0'
  implementation "androidx.multidex:multidex:2.0.1"

  debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
  debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
    exclude group:'com.squareup.okhttp3', module:'okhttp'
  }
  debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")

  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation jscFlavor
  }

  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

/* Autolinking */
def cliNativeModulesGradle = file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!cliNativeModulesGradle.exists()) {
  cliNativeModulesGradle = file("../../node_modules/react-native/node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}
apply from: cliNativeModulesGradle
applyNativeModulesAppBuildGradle(project)

/* Your fonts hook (keep) */
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

tasks.whenTaskAdded { task ->
  if (task.name == 'lintVitalAnalyzeRelease') {
    task.mustRunAfter('copyReactNativeVectorIconFonts')
  }
}
