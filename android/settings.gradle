// android/settings.gradle

pluginManagement {
  // RN’s Gradle plugin is an included build
  includeBuild("../node_modules/@react-native/gradle-plugin")

  // 👇 make sure plugin resolution can use Google's Maven (AGP lives here)
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    google()
    mavenCentral()

    // React Native's local maven
    maven { url("$rootDir/../node_modules/react-native/android") }

    // Notifee: ONLY resolve app.notifee from the local libs packaged in node_modules
    maven {
      url = uri("$rootDir/../node_modules/@notifee/react-native/android/libs")
      content {
        includeGroup("app.notifee")
        includeGroupByRegex("app\\.notifee\\..*")
      }
    }

    // JitPack (AndroidLame-kotlin for react-native-compressor; Dimezis BlurView; yalantis/ucrop for react-native-image-crop-picker)
    maven {
      url = uri("https://jitpack.io")
      content {
        includeGroup("com.github.banketree")
        includeGroup("com.github.Dimezis")
        includeGroup("com.github.yalantis")
      }
    }
  }
}



def cliNativeModulesGradle = file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
if (!cliNativeModulesGradle.exists()) {
  // npm may place this package under react-native/node_modules instead of the root node_modules.
  cliNativeModulesGradle = file("../node_modules/react-native/node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
}

apply from: cliNativeModulesGradle
applyNativeModulesSettingsGradle(settings)

rootProject.name = "akcruapp"

include(":app")
