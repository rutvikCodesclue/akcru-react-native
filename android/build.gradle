//android\build.gradle
buildscript {
  ext {
    compileSdkVersion       = 34
    targetSdkVersion        = 34
    minSdkVersion           = 23
    ndkVersion              = "23.1.7779620"
    kotlinVersion           = "1.9.24"

    // any per-module overrides if you still need them
    Hmssdk_compileSdkVersion = 34
    Castle_compileSdkVersion = 34
    useExoplayerIMA = true
    useExoplayerRtsp = true
    useExoplayerSmoothStreaming = true
    useExoplayerDash = true
    useExoplayerHls = true
    // …etc.
  }

  repositories {
    google()
    mavenCentral()
    mavenLocal()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.1.2")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    classpath("com.google.gms:google-services:4.4.0")
  }
}

// ← add this at the bottom
subprojects { proj ->
  proj.plugins.withId("com.android.library") {
    proj.extensions.configure("android") { androidExt ->
      // 1) Enable BuildConfig
      androidExt.buildFeatures.buildConfig = true

      // 2) Auto-assign a valid namespace if missing
      if (!androidExt.hasProperty("namespace") || !androidExt.namespace) {
        def ns = "com.${proj.name.replaceAll(/[-_]/, ".")}".toLowerCase()
        androidExt.namespace = ns
      }
    }
  }
}

subprojects { subproject ->
  subproject.configurations.all { config ->
    config.resolutionStrategy.eachDependency { details ->
      if (details.requested.group == "com.google.android.gms"
          && details.requested.name == "play-services-ads") {
        // 23.5.0 works with Kotlin 1.8/1.9 and AGP 8.1.x
        details.useVersion "23.5.0"
        details.because("RN Google Mobile Ads expects 20+ API; 10.x will not compile.")
      }
    }
  }
}

// Unify AndroidX versions so react-native-video compiles (PiP uses OnUserLeaveHintProvider)
subprojects { subproject ->
  subproject.configurations.all { config ->
    config.resolutionStrategy.eachDependency { details ->
      if (details.requested.group == "androidx.core"
          && (details.requested.name == "core" || details.requested.name == "core-ktx")) {
        details.useVersion "1.13.1"
        details.because("ComponentActivity implements androidx.core.app.OnUserLeaveHintProvider (core≥1.13).")
      }
      if (details.requested.group == "androidx.activity"
          && (details.requested.name == "activity" || details.requested.name == "activity-ktx")) {
        // Keep Activity aligned with modern Core
        details.useVersion "1.9.3"
      }
    }
  }
}


// Align Java/Kotlin targets for the 100ms HMS module
subprojects { subproject ->
  if (subproject.name == "100mslive_react-native-hms") {
    subproject.afterEvaluate {
      if (subproject.hasProperty("android")) {
        subproject.android {
          compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
          }
        }
      }
      // keep Kotlin at 17 as configured by RN's plugin, just in case
      subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = "17"
      }
    }
  }
}

