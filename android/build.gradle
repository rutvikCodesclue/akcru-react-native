// Align Java/Kotlin to 17 across all Android subprojects (AGP 8-safe)
subprojects { sp ->
  sp.plugins.withId("com.android.application") {
    def androidExt = sp.extensions.getByName("android")
    androidExt.compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }
  }
  sp.plugins.withId("com.android.library") {
    def androidExt = sp.extensions.getByName("android")
    androidExt.compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }
  }
  // Kotlin jvmTarget
  sp.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions { jvmTarget = "17" }
  }
}

// If any stubborn module still compiles Java at 1.8, force it explicitly:
subprojects { sp ->
  if (sp.name == "castleio_react-native-castle") {
    sp.afterEvaluate {
      if (sp.hasProperty("android")) {
        sp.android {
          compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
          }
        }
      }
    }
  }
}
// Force Java/Kotlin 17 specifically for PostHog session replay (applies AFTER the module sets 1.8)
subprojects { sp ->
  if (sp.name == "posthog-react-native-session-replay" || sp.name == "@posthog_react-native-session-replay") {

    // Ensure Android compileOptions use 17 even if the lib sets 1.8 inside its build.gradle
    sp.afterEvaluate {
      def androidExt = sp.extensions.findByName("android")
      if (androidExt != null) {
        androidExt.compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }

      // Also force JavaCompile tasks to 17 for extra safety
      sp.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
        // (options.release = 17 is fine too, but not necessary if source/target are set)
      }
    }

    // Keep Kotlin aligned
    sp.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
      kotlinOptions { jvmTarget = "17" }
    }
  }
}

// Force Java/Kotlin 17 for react-native-compressor (overrides any 11 set in the lib)
subprojects { sp ->
  if (sp.name == "react-native-compressor") {
    sp.afterEvaluate {
      def androidExt = sp.extensions.findByName("android")
      if (androidExt != null) {
        androidExt.compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
      // Belt & suspenders: make the JavaCompile tasks use 17 too
      sp.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
        options.release = 17
      }
    }
    // Keep Kotlin aligned with 17
    sp.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
      kotlinOptions { jvmTarget = "17" }
    }
  }
}

// ---- Finalize Java/Kotlin to 17 for all Android subprojects (AGP 8 safe) ----
subprojects { sp ->
  sp.afterEvaluate {
    def isAndroid = sp.plugins.hasPlugin("com.android.application") || sp.plugins.hasPlugin("com.android.library")
    if (isAndroid) {
      def androidExt = sp.extensions.findByName("android")
      if (androidExt != null) {
        androidExt.compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
      // Ensure JavaCompile tasks also honor 17 even if the lib hard-codes 1.8/11
      sp.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
        options.release = 17
      }
    }
  }

  // Kotlin already set globally, but keep it here too
  sp.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions { jvmTarget = "17" }
  }
}

